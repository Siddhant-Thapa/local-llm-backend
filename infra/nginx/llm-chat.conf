# Nginx configuration for llm-chat
# Place at /etc/nginx/sites-available/llm-chat and symlink to sites-enabled/

server {
    listen 80;
    server_name _;

    # Serve React static build
    root /var/www/llm-chat;
    index index.html;

    # SSE endpoint — disable ALL buffering so tokens reach the browser immediately
    location /api/chat {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";      # keep-alive to upstream
        proxy_set_header   Host $host;

        # These three together prevent Nginx from accumulating the SSE body
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;

        chunked_transfer_encoding on;
        proxy_read_timeout 120s;              # allow long generations on t2.micro
    }

    # All other API routes (standard proxying with buffering is fine)
    location /api/ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
